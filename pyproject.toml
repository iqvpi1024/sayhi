[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "noetide"
version = "0.3.5"
description = "sayhi (识海) — local-first personal memory hub for all your agents"
readme = {file = "README.md", content-type = "text/markdown"}
license = {text = "MIT"}
requires-python = ">=3.12"
dependencies = []
authors = [{name = "Noetide Project"}]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: End Users/Desktop",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3.12",
  "Topic :: Office/Business :: Scheduling"
]

[project.scripts]
noetide = "noetide_micro.cli:main"
noetide-product = "noetide_micro.product_server:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
noetide_micro = ["schema.sql", "webui.html"]
